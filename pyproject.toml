[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultimate-rag"
version = "1.2.0"
description = "Ultimate RAG Framework - Comprehensive Retrieval-Augmented Generation for AI Models (2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "RAG Framework Contributors" },
]
keywords = ["rag", "retrieval-augmented-generation", "ai", "llm", "vector-search", "knowledge-graph", "agentic-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core LangChain + LLM providers
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",

    # Agentic RAG
    "langgraph>=0.2.0",

    # Default vector store + hybrid search
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",

    # Document loaders
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",

    # Vietnamese NLP
    "underthesea>=6.8.0",
    "pyvi>=0.1.1",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
# Local HuggingFace embeddings and cross-encoder rerankers (pulls in torch).
# Needed for the default embedding provider ("huggingface") and reranking.
local-models = [
    "sentence-transformers>=3.0.0",
]
qdrant = [
    "qdrant-client>=1.9.0",
    "langchain-qdrant>=0.2.0",
]
chroma = [
    "chromadb>=0.5.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
    "pdf2image>=1.17.0",
]
monitoring = [
    "langfuse>=2.0.0",
]
# Third-party evaluation frameworks (the built-in src.evaluation needs none).
eval = [
    "ragas>=0.1.0",
    "deepeval>=1.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]
ui = [
    "gradio>=4.25.0",
]
web = [
    "duckduckgo-search>=7.0.0",
    "tavily-python>=0.5.0",
]
graph = [
    "neo4j>=5.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]
all = [
    "ultimate-rag[local-models,qdrant,chroma,ocr,monitoring,eval,api,ui,web,graph]",
]

[project.urls]
Homepage = "https://github.com/yourusername/ultimate-rag"
Documentation = "https://github.com/yourusername/ultimate-rag#readme"
Repository = "https://github.com/yourusername/ultimate-rag"
Issues = "https://github.com/yourusername/ultimate-rag/issues"

[tool.hatch.build.targets.wheel]
# The code is imported as the top-level `src` package (e.g. `from src.rag import ...`).
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
known_first_party = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so newer ruff releases do not change what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Examples put the repo root on sys.path before importing src.
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
