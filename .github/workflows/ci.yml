name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Same-repo PRs are already covered by the push run; only fork PRs need their own.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4.0"
      - run: ruff check src tests examples scripts

  test:
    # Same-repo PRs are already covered by the push run; only fork PRs need their own.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      # Server-mode Qdrant, as in docker-compose; the image has no curl, so probe the port.
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # Never pick up .env files; tests/conftest.py also strips secrets.
      RAG_DISABLE_DOTENV: "1"
      QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Lightweight core + Qdrant client: tests mock models, so torch is not installed.
      - run: pip install -e ".[dev,api,qdrant]"
      - run: python -m compileall -q src tests examples scripts
      - run: python -m pytest -q
